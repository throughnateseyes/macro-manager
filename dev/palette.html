<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="../renderer/tokens.css" />
  <link rel="stylesheet" href="../renderer/palette.css" />
  <title>Quick Insert</title>
</head>
<body>
  <div class="palette">
    <div id="tray-head" class="tray-head hidden">
      <div class="today"><strong id="t-today">0</strong><span>today</span></div>
      <div class="today"><strong id="t-streak">0</strong><span>day streak</span></div>
      <div class="today"><strong id="t-life">0</strong><span>all time</span></div>
      <button id="t-open" class="open-btn">Open app</button>
    </div>
    <label class="field">
      <svg class="icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q" type="text" placeholder="Search macros" autocomplete="off" spellcheck="false" />
    </label>
    <div id="results" class="results" role="listbox"></div>
    <section id="fill" class="fill hidden" aria-labelledby="fill-title">
      <header class="fill-head">
        <span id="fill-title" class="fill-title"></span>
        <span id="fill-abbr" class="chip"></span>
      </header>
      <div id="fill-fields" class="fill-fields"></div>
      <div class="fill-preview">
        <div class="fill-preview-label">Preview</div>
        <div id="fill-preview" class="fill-preview-body expansion"></div>
      </div>
    </section>
    <footer class="foot">
      <span><kbd>↵</kbd> <span id="enter-label">Insert</span></span>
      <span id="copy-hint"><kbd id="k-copy">⌘C</kbd> Copy</span>
      <span id="edit-hint"><kbd id="k-edit">⌘E</kbd> Edit</span>
      <span id="tab-hint" class="hidden"><kbd>tab</kbd> Next field</span>
      <span class="spacer"></span>
      <span><kbd>esc</kbd> <span id="esc-label">Close</span></span>
    </footer>
  </div>
  <script src="../lib/placeholders.js"></script><script src="../lib/fields.js"></script><script src="../lib/shortcuts.js"></script><script src="../lib/format.js"></script>
  <script src="mock-api.js"></script><script src="../renderer/fillform.js"></script><script src="../renderer/palette.js"></script>
</body>
</html>
