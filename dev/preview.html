<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <link rel="stylesheet" href="../renderer/tokens.css" />
  <link rel="stylesheet" href="../renderer/style.css" />
  <title>Macro Manager</title>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-top drag">
        <div class="win-brand">
          <img src="../assets/icon.png" alt="" width="18" height="18" />
          <span>Macro Manager</span>
        </div>
      </div>

      <label class="search">
        <svg class="icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
        <kbd id="search-kbd"></kbd>
      </label>

      <nav class="nav" aria-label="Sections">
        <button class="nav-item" data-view="overview">
          <svg class="icon" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.4"/><rect x="9" y="2" width="5" height="5" rx="1.4"/><rect x="2" y="9" width="5" height="5" rx="1.4"/><rect x="9" y="9" width="5" height="5" rx="1.4"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-view="builtins">
          <svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.3 1.6"/></svg>
          <span>Date &amp; Time</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg class="icon" viewBox="0 0 16 16"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"/><circle cx="11" cy="4.5" r="1.5"/><circle cx="5" cy="11.5" r="1.5"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="list-header">
        <span class="list-title">Macros <span id="macro-count" class="count"></span></span>
        <div class="list-actions">
          <button id="btn-sort" class="icon-btn" title="Sort">
            <svg class="icon" viewBox="0 0 16 16"><path d="M5 3v10M2.5 10.5 5 13l2.5-2.5M11 13V3M8.5 5.5 11 3l2.5 2.5"/></svg>
          </button>
          <button id="btn-new" class="icon-btn" title="New macro">
            <svg class="icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
          </button>
        </div>
      </div>

      <div id="macro-list" class="macro-list" role="listbox" aria-label="Macros"></div>

      <div id="sidebar-footer" class="sidebar-footer"></div>
    </aside>

    <main id="main">
      <header class="toolbar drag">
        <div id="toolbar-left" class="toolbar-left"></div>
        <div id="toolbar-right" class="toolbar-right no-drag"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="menu" class="menu hidden" role="menu"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="mock-api.js"></script><script src="../renderer/app.js"></script>
</body>
</html>
