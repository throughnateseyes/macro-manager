<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3FF"/>
      <stop offset="1" stop-color="#2F5BEA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1a4a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  </g>
  <!-- the trigger slash -->
  <path d="M352 300 L270 724" stroke="#ffffff" stroke-width="76" stroke-linecap="round"/>
  <!-- the text it expands into -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="56">
    <path d="M452 392 H742" opacity="0.98"/>
    <path d="M452 512 H702" opacity="0.82"/>
    <path d="M452 632 H612" opacity="0.66"/>
  </g>
</svg>
