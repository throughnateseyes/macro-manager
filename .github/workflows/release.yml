name: Build & Release

# Push a tag like v2.1.0 (npm run release:patch does this for you) and this
# workflow tests the code, builds the Mac and Windows installers, launches each
# one to make sure it starts, uploads them to a GitHub Release, and publishes
# it. Installed copies of the app check that release and update themselves.
#
# "Run workflow" from the Actions tab builds installers without releasing —
# handy for trying a build before tagging it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $PKG"
            exit 1
          fi

  # One draft release up front, so the Mac and Windows jobs don't race to
  # create two.
  draft:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Macro Manager ${TAG#v}" --generate-notes

  build:
    needs: [test, draft]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Same certificate on every release, so macOS keeps the Accessibility
      # permission through updates (see scripts/mac-signing-keychain.sh).
      - name: Load Mac signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          scripts/mac-signing-keychain.sh "$RUNNER_TEMP/cert.p12" "$MAC_CERT_PASSWORD"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_MAC_SIGNING: ${{ runner.os == 'macOS' && '1' || '' }}
        run: npx electron-builder ${{ matrix.platform }} --publish never

      - name: Check Mac signature
        if: runner.os == 'macOS'
        run: |
          for app in "release/mac-arm64/Macro Manager.app" "release/mac/Macro Manager.app"; do
            codesign --verify --deep --strict "$app"
            codesign -d -r- "$app" 2>&1 | grep -q 'certificate root = H"b5dd7f2bcf250c8f3f2604486bf8b0f8ada92db6"' \
              || { echo "::error::$app isn't signed with the Macro Manager certificate"; exit 1; }
          done
          echo "Both Mac builds signed with the Macro Manager certificate"

      # Launch the packaged app for real; nothing is uploaded if it can't start.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env: { MACRO_MANAGER_DATA: '${{ runner.temp }}/smoke' }
        run: '"release/win-unpacked/Macro Manager.exe" --smoke-test'
      - name: Smoke test (Mac)
        if: runner.os == 'macOS'
        env: { MACRO_MANAGER_DATA: '${{ runner.temp }}/smoke' }
        run: '"release/mac-arm64/Macro Manager.app/Contents/MacOS/Macro Manager" --smoke-test'

      - name: Upload to release ${{ env.TAG }}
        if: github.event_name == 'push'
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber release/*.exe release/*.dmg release/*.zip release/*.blockmap release/latest*.yml

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
          if-no-files-found: error

  # Only after both installers are uploaded does the release go live, so the
  # auto-updater never sees a half-finished release.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release edit "$TAG" --draft=false --latest
